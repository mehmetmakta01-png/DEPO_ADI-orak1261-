

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORAK-LAND Komuta Merkezi v8.0</title>
    <style>
        body {
            background-color: #000000;
            color: #00FF33;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #00FF33;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 51, 0.2);
        }
        .header {
            text-align: center;
            border-bottom: 2px dashed #00FF33;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 5px 0;
            font-size: 24px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00FF33;
        }
        .meta-info {
            font-size: 11px;
            color: #88ff88;
            margin-bottom: 5px;
        }
        .status-box {
            border: 1px solid #00FF33;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(0, 20, 0, 0.5);
        }
        .status-title {
            font-size: 12px;
            color: #88ff88;
            text-transform: uppercase;
        }
        .status-value {
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
        }
        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #00FF33;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }
        .terminal {
            background-color: #111111;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            height: 180px;
            overflow-y: auto;
            font-size: 12px;
        }
        .log-entry {
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .log-time { color: #8888ff; }
        .log-tag { color: #ff88ff; }
        .log-success { color: #00FF33; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ORAK-LAND</h1>
        <div class="meta-info">DİJİTAL EGEMENLİK VE OTONOM SİSTEMLER v8.0</div>
        <div class="meta-info" style="color: #FFCC00;">YETKİLİ: MEHMET MAKTA 3228</div>
    </div>

    <div class="status-box">
        <div class="status-title"><span class="pulse"></span>Sistem Durumu</div>
        <div class="status-value" style="color: #00FF33;">SİSTEM AKTİF</div>
    </div>

    <div class="status-box">
        <div class="status-title">Üretilen Modüller</div>
        <div class="status-value" style="color: #00FF33;">1261</div>
        <div class="meta-info" style="margin-top:5px; font-size:10px;">orak_land_arsiv/ dizini mühürlendi.</div>
    </div>

    <div class="status-box">
        <div class="status-title">Karar Durumu</div>
        <div class="status-value" style="color: #FFCC00;">STABİL</div>
        <div class="meta-info" style="margin-top:5px; font-size:10px;">Otonom nöbet kararlılığı: %100</div>
    </div>

    <div class="status-box" style="margin-bottom: 0;">
        <div class="status-title" style="margin-bottom: 8px;">OTONOM_TERMINAL_V8_LOG</div>
        <div class="terminal" id="terminalLog">
            <!-- Loglar JavaScript ile dinamik akacak -->
        </div>
    </div>
</div>

<script>
    const logs = [
        { time: "13:53:20", tag: "[YENİLEME]", text: "ORAK-LAND v8.0 Çekirdek güncellemesi başarıyla yüklendi.", class: "log-success" },
        { time: "13:54:00", tag: "[GÜVENLİK]", text: "Dış bağlantı koridorları stabilize edildi, yerel protokollere kilitlendi.", class: "log-success" },
        { time: "13:55:10", tag: "[YÖNETİM]", text: "Durum raporu yerel JSON arşivine başarıyla işlendi.", class: "log-success" },
        { time: "13:57:00", tag: "[KOD FABRİKASI]", text: "Yeni kararlı otonom algoritma diske kilitlendi: orak_king_kod_*.py.", class: "log-success" },
        { time: "14:01:00", tag: "[SİSTEM]", text: "Karar Durumu: STABİL (Siber nöbet kesintisiz devam ediyor).", class: "log-success" }
    ];

    const terminal = document.getElementById("terminalLog");
    
    logs.forEach(log => {
        const div = document.createElement("div");
        div.className = "log-entry";
        div.innerHTML = `<span class="log-time">[${log.time}]</span> <span class="log-tag">${log.tag}</span> <span class="${log.class}">${log.text}</span>`;
        terminal.appendChild(div);
    });
</script>

</body>
</html>
